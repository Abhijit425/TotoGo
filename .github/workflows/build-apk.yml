name: Build TotoGo debug APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Passenger + Driver
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :passenger:assembleDebug :driver:assembleDebug
      - name: Collect APKs
        run: |
          mkdir -p out
          cp passenger/build/outputs/apk/debug/passenger-debug.apk out/TotoGo-Passenger-debug.apk
          cp driver/build/outputs/apk/debug/driver-debug.apk out/TotoGo-Driver-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TotoGo-debug-apks
          path: out/*.apk
      - name: Publish APKs as a GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TotoGo build ${{ github.run_number }} (debug, DEMO mode)
          body: |
            Debug APKs for TotoGo Passenger and TotoGo Driver.
            Install both on Android 8.0+. Demo login OTP: 123456. All drivers, passengers and rides in DEMO mode are simulated.
          files: out/*.apk
          make_latest: true

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TotoGo-debug-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apks/TotoGo-Passenger-debug.apk
            adb install -r apks/TotoGo-Driver-debug.apk
            python3 ci/e2e.py
      - name: Publish screenshots to ci-screens branch
        if: always()
        run: |
          [ -d e2e-out ] || exit 0
          cd e2e-out
          git init -q && git checkout -q -b ci-screens
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "e2e run ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-screens
